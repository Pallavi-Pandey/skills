// Lab 05 - gRPC Calculator Service Definition

syntax = "proto3";

option go_package = "lab05grpc/calculator";

package calculator;

service Calculator {
  // Send one calculation request and receive one response.
  rpc Calculate (CalcRequest) returns (CalcResponse);

  // Request a Fibonacci sequence and receive streamed responses.
  rpc FibonacciStream (FibRequest) returns (stream FibResponse);
}

message CalcRequest {
  string operation = 1;
  double a = 2;
  double b = 3;
}

message CalcResponse {
  double result = 1;
  string error = 2;
}

message FibRequest {
  int32 count = 1;
}

message FibResponse {
  int64 value = 1;
  int32 index = 2;
}
